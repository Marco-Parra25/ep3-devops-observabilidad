# Dependabot — análisis automático de dependencias vulnerables (IE8).
# Abre Pull Requests automáticamente cuando hay actualizaciones de seguridad
# o de versión, complementando a SonarCloud y Trivy en la política de
# cumplimiento y seguridad del pipeline CI/CD.
version: 2
updates:
  # Dependencias de la aplicación Java (Maven)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "seguridad"
    commit-message:
      prefix: "deps"

  # Acciones usadas en los workflows de GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    commit-message:
      prefix: "ci"

  # Imagen base del Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "docker"
    commit-message:
      prefix: "docker"
