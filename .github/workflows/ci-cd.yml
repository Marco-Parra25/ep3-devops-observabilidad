name: CI/CD Pipeline - Observabilidad EP3

# Se ejecuta en cada push y en cada Pull Request hacia main.
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

# Permisos mínimos (principio de menor privilegio - cumplimiento IE5).
permissions:
  contents: read
  security-events: write
  packages: write        # necesario para publicar la imagen en GHCR

jobs:
  # ============================================================
  # JOB 1: Build + Tests + Cobertura
  # Si los tests fallan o la cobertura baja del 70%, el pipeline
  # se DETIENE aquí y no continúa al despliegue (IE6).
  # ============================================================
  build-test:
    name: Build, Test y Cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo, necesario para SonarQube

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar pruebas con cobertura (quality gate JaCoCo)
        # 'verify' incluye la regla de JaCoCo: si la cobertura < 70%, falla -> pipeline detenido (IE6).
        run: mvn -B clean verify

      - name: Publicar reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # ============================================================
  # JOB 2: Análisis de seguridad (Trivy)
  # La calidad de código la analiza SonarCloud con Análisis Automático,
  # que publica el check "SonarCloud Code Analysis" y es requerido por
  # la protección de rama (IE5). Aquí cubrimos el escaneo de vulnerabilidades.
  # ============================================================
  security-scan:
    name: Análisis de seguridad (Trivy)
    runs-on: ubuntu-latest
    needs: build-test           # solo corre si build-test pasó
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Escaneo de vulnerabilidades del sistema de archivos (Trivy)
        # Detiene el pipeline si hay vulnerabilidades CRÍTICAS o ALTAS (IE6).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'          # <-- rompe el pipeline ante hallazgos críticos
          ignore-unfixed: true

  # ============================================================
  # JOB 3: Pruebas de aceptación (smoke test sobre el contenedor)
  # Levanta la imagen real y valida los endpoints. Debe pasar ANTES
  # de permitir el despliegue a producción (IE13).
  # ============================================================
  acceptance-test:
    name: Pruebas de aceptación
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir la imagen de la aplicación
        run: docker build -t ep3-app:test .

      - name: Levantar el contenedor
        run: docker run -d --name ep3-app -p 8080:8080 ep3-app:test

      - name: Esperar a que la aplicación esté saludable
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ Aplicación saludable"; exit 0
            fi
            sleep 3
          done
          echo "❌ La aplicación no quedó saludable a tiempo"; docker logs ep3-app; exit 1

      - name: Verificar endpoints clave (criterios de aceptación)
        run: |
          curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          curl -sf http://localhost:8080/actuator/prometheus | grep -q 'jvm_memory_used_bytes'
          echo "✅ Endpoints de salud y métricas OK"

      - name: Detener el contenedor
        if: always()
        run: docker rm -f ep3-app || true

  # ============================================================
  # JOB 4: Publicación de la imagen en GHCR (registro público)
  # Equivalente a Docker Hub. Solo se publica si TODO lo anterior
  # pasó, incluidas las pruebas de aceptación (IE7).
  # ============================================================
  publish-image:
    name: Publicar imagen en GHCR
    runs-on: ubuntu-latest
    needs: acceptance-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # ============================================================
  # JOB 5: Despliegue automático (CD) en AWS EKS
  # Solo se ejecuta al fusionar a main y si TODO lo anterior pasó.
  # Construye la imagen, la publica en Amazon ECR y actualiza el
  # despliegue en el cluster EKS de forma automática.
  # ============================================================
  deploy-eks:
    name: Desplegar en AWS EKS
    runs-on: ubuntu-latest
    needs: [acceptance-test, publish-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
      ACCOUNT_ID: "081611519281"
      # En esta sesión del Learner Lab se reutiliza el cluster compartido;
      # k8s/eks-cluster.yaml permite crear uno dedicado (ep3-cluster) si se prefiere.
      CLUSTER: tienda-cluster
      ECR_REPO: ep3-observability
      NAMESPACE: devops-ep3
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login a Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Construir y publicar la imagen en ECR
        run: |
          IMAGE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Desplegar en el cluster EKS
        run: |
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          IMAGE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO"
          kubectl set image deployment/observability-service \
            observability-service="$IMAGE:${{ github.sha }}" -n "$NAMESPACE"
          kubectl rollout status deployment/observability-service -n "$NAMESPACE" --timeout=180s
          echo "Despliegue automático completado ✅"
          kubectl get pods -n "$NAMESPACE" -l app=observability-service
