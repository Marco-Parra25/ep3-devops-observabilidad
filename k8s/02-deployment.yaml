apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-service
  namespace: devops-ep3
  labels:
    app: observability-service
spec:
  replicas: 2                      # alta disponibilidad: 2 réplicas
  selector:
    matchLabels:
      app: observability-service
  template:
    metadata:
      labels:
        app: observability-service
      annotations:
        # Estas anotaciones permiten que Prometheus descubra y scrapee el pod
        # automáticamente (observabilidad automatizada - IE2).
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: observability-service
          # Imagen publicada en Amazon ECR (misma cuenta del cluster).
          image: 654654493647.dkr.ecr.us-east-1.amazonaws.com/ep3-observability:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Límites de recursos: necesarios para medir uso de CPU/memoria (IE3)
          # y para que Kubernetes proteja el nodo.
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Probes basadas en Actuator: trazabilidad de disponibilidad (IE1/IE2).
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          # Endurecimiento de seguridad del contenedor (cumplimiento - IE5).
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      # Volumen temporal escribible para la JVM/Tomcat (root filesystem es de solo lectura).
      volumes:
        - name: tmp
          emptyDir: {}
